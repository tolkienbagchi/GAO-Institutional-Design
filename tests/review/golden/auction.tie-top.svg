<svg class="gao-timeline" viewBox="0 0 920 360" width="100%" style="max-width:920px;min-width:828px" role="img" aria-label="Two bidders tie for the highest bid" data-rows="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
<title>Two bidders tie for the highest bid</title>
