<text x="375" y="38" font-weight="600" font-size="12" fill="currentColor">what</text>
<g class="band"><rect x="4" y="52" width="912" height="26" rx="4" fill="currentColor" fill-opacity="0.07"/><text x="44" y="69" text-anchor="middle" font-size="10" fill="currentColor">rules</text><text class="lane-name" x="134" y="69" text-anchor="middle" font-size="10" fill="currentColor"><title>alice</title>alice</text><text class="lane-name" x="224" y="69" text-anchor="middle" font-size="10" fill="currentColor"><title>bob</title>bob</text><text class="lane-name" x="314" y="69" text-anchor="middle" font-size="10" fill="currentColor"><title>carol</title>carol</text><text x="375" y="69" font-weight="600" font-size="13" fill="currentColor"><title>Bidding</title>Bidding<tspan dx="8" font-weight="400" font-style="italic" font-size="11"></tspan></text></g>
<g class="move chose"><title>alice chooses: amount = 8</title><path d="M134 92 H52" fill="none" stroke="currentColor"/><polygon class="head" points="45,92 52,88 52,96" fill="currentColor"/><text class="what" x="375" y="96" font-size="12" fill="currentColor">alice: amount = 8</text></g>
