<g class="lane"><title>bob</title><text x="224" y="38" text-anchor="middle" font-weight="600" font-size="12" fill="currentColor">bob</text><path d="M224 44 V326" fill="none" stroke="currentColor" stroke-dasharray="1 3" stroke-opacity="0.55"/></g>
