[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gao-idl"
version = "0.0.1"
description = "Composable multi-agent environments with resumable, replayable sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "numpy>=1.26"]

[project.optional-dependencies]
llm = ["httpx"]
dev = ["pytest", "pytest-timeout", "hypothesis", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/gao_idl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 30
markers = ["slow: long-running tests (CI runs them nightly: pytest -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["httpx", "httpx.*"]
ignore_missing_imports = true  # the `llm` extra; absent in some environments, typed when present
