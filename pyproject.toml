[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gao-idl"
version = "0.1.0"
description = "Composable multi-agent environments with resumable, replayable sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Tolkien Bagchi", email = "tb549@cornell.edu"}]
dependencies = ["pydantic>=2.7", "numpy>=1.26"]
keywords = ["multi-agent", "mechanism design", "game theory", "reinforcement learning", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/tolkienbagchi/GAO-Institutional-Design"
Documentation = "https://github.com/tolkienbagchi/GAO-Institutional-Design/tree/main/docs"

[project.scripts]
gao-idl = "gao_idl.cli:main"

[project.optional-dependencies]
llm = ["httpx"]
dev = ["pytest", "pytest-timeout", "hypothesis", "ruff", "mypy", "build", "twine"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["src/gao_idl"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/scripts",
    "/mkdocs.yml",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
    "/NOTES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 30
markers = ["slow: long-running tests (CI runs them nightly: pytest -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["httpx", "httpx.*"]
ignore_missing_imports = true  # the `llm` extra; absent in some environments, typed when present
